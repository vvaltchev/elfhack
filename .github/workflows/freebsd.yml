name: FreeBSD
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bt: [Debug, Release]

    steps:
    - uses: actions/checkout@v7

    # FreeBSD's native binaries are ELF too: the tests run there as on
    # Linux. The VM runs everything as root, so the tests on read-only files
    # skip themselves (root can write anyway).
    - name: Build and test in a FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: pkg install -y cmake ninja python3
        run: |
          set -e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.bt }}
          cmake --build build
          python3 tests/run_tests --build-dir build --verbose
