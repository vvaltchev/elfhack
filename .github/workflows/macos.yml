name: macOS
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bt: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.bt }}

    - name: Build
      run: cmake --build build

    # The tests run only on Linux: this checks that elsewhere the runner
    # skips them cleanly instead of failing.
    - name: Test
      run: python3 tests/run_tests --build-dir build
